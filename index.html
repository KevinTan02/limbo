<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Limbo"/>
  <title>Limbo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;background:#111;overscroll-behavior:none}
    body{font-family:'DM Mono',monospace;color:#f0ede0}
    #app{max-width:430px;margin:0 auto;padding:16px;padding-bottom:40px}
    #setup{display:block}#game{display:none}#bust-modal{display:none}#end-screen{display:none}

    .screen-title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:3px;color:#e8c84a;text-align:center;margin-bottom:4px}
    .screen-sub{font-size:11px;color:#888;text-align:center;margin-bottom:24px;letter-spacing:2px;text-transform:uppercase}

    .player-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
    .player-row{display:flex;gap:8px;align-items:center}
    .player-row input{flex:1;background:#1a1a1a;border:1px solid #333;color:#f0ede0;font-family:'DM Mono',monospace;font-size:16px;padding:12px 14px;border-radius:8px;outline:none;-webkit-appearance:none}
    .player-row input:focus{border-color:#555}
    .remove-btn{background:none;border:1px solid #333;color:#888;font-size:18px;width:44px;height:44px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

    .add-btn{width:100%;background:none;border:1px dashed #333;color:#888;font-family:'DM Mono',monospace;font-size:13px;padding:12px;border-radius:8px;cursor:pointer;letter-spacing:1px}
    .start-btn{width:100%;background:#e8c84a;border:none;color:#111;font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;padding:16px;border-radius:10px;cursor:pointer;margin-top:16px}
    .start-btn:active{opacity:0.85}

    .bar-display{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
    .bar-label{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase}
    .bar-value{font-family:'Bebas Neue',sans-serif;font-size:48px;color:#e8c84a;line-height:1}

    .players-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
    .player-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
    .player-card.active{border:2px solid #e8c84a;background:#1f1d10}
    .player-card.eliminated{opacity:0.3}
    .player-name-col{display:flex;flex-direction:column;gap:3px}
    .pname{font-size:15px;font-weight:500}
    .active-tag{font-size:10px;color:#e8c84a;letter-spacing:1px;text-transform:uppercase}
    .lives-display{display:flex;gap:5px}
    .life-dot{width:12px;height:12px;border-radius:50%;background:#e8c84a}
    .life-dot.lost{background:#2a2a2a;border:1px solid #333}

    .scoring-panel{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:16px;margin-bottom:14px}
    .scoring-header{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
    .darts-row{display:flex;gap:8px;margin-bottom:14px}
    .dart-slot{flex:1;background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:10px 6px;text-align:center;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .dart-slot.filled{border-color:#444}
    .dart-slot.current{border:2px solid #e8c84a;background:#1f1d10}
    .dart-num{font-size:10px;color:#888;margin-bottom:3px}
    .dart-val{font-family:'Bebas Neue',sans-serif;font-size:24px;color:#f0ede0;line-height:1}
    .dart-multi{font-size:9px;color:#888;margin-top:2px;letter-spacing:1px}

    .running-total{text-align:center;margin-bottom:14px}
    .rt-label{font-size:11px;color:#888;letter-spacing:1px;text-transform:uppercase}
    .rt-value{font-family:'Bebas Neue',sans-serif;font-size:52px;line-height:1;margin-top:4px}

    .numpad-input{background:#111;border:1px solid #444;border-radius:8px;color:#f0ede0;font-family:'Bebas Neue',sans-serif;font-size:32px;text-align:center;padding:12px;width:100%;margin-bottom:10px;outline:none;-webkit-appearance:none}

    .multiplier-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

    .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
    .numpad button{background:#111;border:1px solid #2a2a2a;color:#f0ede0;font-family:'DM Mono',monospace;font-size:20px;padding:16px 0;border-radius:8px;cursor:pointer;-webkit-appearance:none}
    .numpad button:active{background:#222}

    .confirm-dart-btn{width:100%;background:#3fc97a;border:none;color:#0a1a10;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;padding:14px;border-radius:8px;cursor:pointer}
    .confirm-dart-btn:active{opacity:0.85}
    .undo-btn{width:100%;background:none;border:1px solid #333;color:#888;font-family:'DM Mono',monospace;font-size:13px;padding:12px;border-radius:8px;cursor:pointer;margin-top:8px}
    .undo-btn:disabled{opacity:0.3;cursor:not-allowed}

    #bust-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:100;display:none;align-items:center;justify-content:center;padding:24px}
    #bust-modal.show{display:flex}
    .modal-box{background:#1a1a1a;border:1px solid #e24b4a;border-radius:14px;padding:28px;width:100%;max-width:360px;text-align:center}
    .bust-title{font-family:'Bebas Neue',sans-serif;font-size:56px;color:#e24b4a;letter-spacing:4px}
    .bust-sub{font-size:14px;color:#888;margin:10px 0 24px;line-height:1.5}
    .modal-confirm{width:100%;background:#e24b4a;border:none;color:#fff;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;padding:14px;border-radius:8px;cursor:pointer;margin-bottom:10px}
    .modal-undo{width:100%;background:none;border:1px solid #333;color:#888;font-family:'DM Mono',monospace;font-size:13px;padding:12px;border-radius:8px;cursor:pointer}

    .bottom-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
    .bottom-btn{background:none;border:1px solid #2a2a2a;color:#555;font-family:'DM Mono',monospace;font-size:11px;padding:10px 8px;border-radius:8px;cursor:pointer;text-align:center}

    /* END SCREEN */
    #end-screen{padding:0}
    .end-header{text-align:center;padding:24px 16px 18px}
    .end-winner-label{font-size:11px;color:#888;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
    .end-winner-name{font-family:'Bebas Neue',sans-serif;font-size:48px;color:#3fc97a;letter-spacing:2px;line-height:1}
    .end-winner-tag{font-size:11px;color:#3fc97a;opacity:0.7;letter-spacing:1px;text-transform:uppercase;margin-top:6px}
    .end-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
    .end-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden}
    .end-card.winner-card{border-color:#3fc97a55}
    .end-card-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #2a2a2a}
    .end-card-name{font-size:15px;font-weight:500}
    .end-card-stats{display:flex;gap:14px}
    .end-stat{text-align:right}
    .end-stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;line-height:1}
    .end-stat-label{font-size:9px;color:#888;letter-spacing:1px;text-transform:uppercase}
    .end-rounds{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
    .end-round-row{display:flex;align-items:center;gap:8px;font-size:13px}
    .round-num{color:#888;min-width:24px;font-size:11px}
    .round-bar-badge{font-size:10px;color:#888;background:#111;border:1px solid #2a2a2a;border-radius:4px;padding:2px 6px;white-space:nowrap}
    .round-score{font-family:'Bebas Neue',sans-serif;font-size:20px;line-height:1;min-width:30px}
    .round-bust-tag{font-size:9px;color:#e24b4a;background:#2a0a0a;border:1px solid #5a1a1a;border-radius:4px;padding:2px 8px;letter-spacing:1px;text-transform:uppercase}
    .elim-tag{font-size:9px;color:#ff8c4a;background:#2a1a0a;border:1px solid #5a3a1a;border-radius:4px;padding:2px 8px;letter-spacing:1px;text-transform:uppercase}
    .end-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .end-btn-primary{background:#e8c84a;border:none;color:#111;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;padding:14px;border-radius:10px;cursor:pointer}
    .end-btn-secondary{background:none;border:1px solid #333;color:#888;font-family:'DM Mono',monospace;font-size:12px;padding:14px;border-radius:10px;cursor:pointer}
    .place-badge{font-size:10px;padding:3px 7px;border-radius:4px;letter-spacing:1px;text-transform:uppercase}
    .place-1{background:#1a2a1a;color:#3fc97a;border:1px solid #3fc97a44}
    .place-2{background:#1a1a2a;color:#4a9eff;border:1px solid #4a9eff44}
    .place-3{background:#2a1a0a;color:#ff8c4a;border:1px solid #ff8c4a44}
    .place-n{background:#1a1a1a;color:#888;border:1px solid #333}
  </style>
</head>
<body>
<div id="app">
  <div id="setup">
    <div class="screen-title">LIMBO</div>
    <div class="screen-sub">Dart Scorer</div>
    <div class="player-list" id="player-list"></div>
    <button class="add-btn" onclick="addPlayer()">+ Add Player</button>
    <button class="start-btn" onclick="startGame()">Start Game</button>
  </div>

  <div id="game">
    <div class="bar-display">
      <div><div class="bar-label">The Bar</div><div class="bar-value" id="bar-val">60</div></div>
      <div style="text-align:right"><div class="bar-label">Dart</div><div class="bar-value" id="dart-num-display">1/3</div></div>
    </div>
    <div class="players-grid" id="players-grid"></div>
    <div class="scoring-panel">
      <div class="scoring-header" id="scoring-header">Your throw</div>
      <div class="darts-row">
        <div class="dart-slot current" id="dart-0"><div class="dart-num">D1</div><div class="dart-val">—</div></div>
        <div class="dart-slot" id="dart-1"><div class="dart-num">D2</div><div class="dart-val">—</div></div>
        <div class="dart-slot" id="dart-2"><div class="dart-num">D3</div><div class="dart-val">—</div></div>
      </div>
      <div class="running-total">
        <div class="rt-label">Running Total</div>
        <div class="rt-value" id="rt-val" style="color:#3fc97a">0</div>
      </div>
      <input class="numpad-input" id="dart-input" type="number" placeholder="0" readonly/>
      <div class="multiplier-row">
        <button id="btn-x2" onclick="toggleMultiplier(2)">x2 Double</button>
        <button id="btn-x3" onclick="toggleMultiplier(3)">x3 Triple</button>
      </div>
      <div class="numpad">
        <button onclick="pad(1)">1</button><button onclick="pad(2)">2</button><button onclick="pad(3)">3</button>
        <button onclick="pad(4)">4</button><button onclick="pad(5)">5</button><button onclick="pad(6)">6</button>
        <button onclick="pad(7)">7</button><button onclick="pad(8)">8</button><button onclick="pad(9)">9</button>
        <button onclick="pad('C')" style="color:#e24b4a">C</button>
        <button onclick="pad(0)">0</button>
        <button onclick="pad('back')" style="font-size:16px">⌫</button>
      </div>
      <button class="confirm-dart-btn" onclick="confirmDart()">Confirm Dart</button>
      <button class="undo-btn" id="undo-btn" onclick="undoLast()" disabled>Undo Last Dart</button>
    </div>
    <div class="bottom-btns">
      <button class="bottom-btn" onclick="resetSamePlayers()">Reset — Same Players</button>
      <button class="bottom-btn" onclick="resetToSetup()">New Game</button>
    </div>
  </div>

  <div id="bust-modal">
    <div class="modal-box">
      <div class="bust-title">BUST!</div>
      <div class="bust-sub" id="bust-sub-text"></div>
      <button class="modal-confirm" onclick="confirmBust()">Confirm Bust</button>
      <button class="modal-undo" onclick="cancelBust()">Undo — Wrong Entry</button>
    </div>
  </div>

  <div id="end-screen">
    <div class="end-header">
      <div class="end-winner-label">Winner</div>
      <div class="end-winner-name" id="end-winner-name"></div>
      <div class="end-winner-tag">Last one standing</div>
    </div>
    <div class="end-cards" id="end-cards"></div>
    <div class="end-btns">
      <button class="end-btn-primary" onclick="resetSamePlayers()">Play Again</button>
      <button class="end-btn-secondary" onclick="resetToSetup()">New Game</button>
    </div>
  </div>
</div>

<script>
const STYLE_OFF = 'font-family:Bebas Neue,sans-serif;font-size:18px;letter-spacing:1px;padding:13px 0;border-radius:8px;cursor:pointer;width:100%;border:2px solid #2a2a2a;background:#111;color:#555;';
const STYLE_X2  = 'font-family:Bebas Neue,sans-serif;font-size:18px;letter-spacing:1px;padding:13px 0;border-radius:8px;cursor:pointer;width:100%;border:2px solid #4a9eff;background:#0d1f35;color:#4a9eff;';
const STYLE_X3  = 'font-family:Bebas Neue,sans-serif;font-size:18px;letter-spacing:1px;padding:13px 0;border-radius:8px;cursor:pointer;width:100%;border:2px solid #c97aff;background:#1c0d35;color:#c97aff;';

let players=[], bar=60, currentIdx=0, dartScores=[], multiplier=1, gameLog=[], eliminationOrder=[], roundNumber=1;

function addPlayer(){players.push({name:'',lives:3,eliminated:false});renderSetup();}
function removePlayer(i){players.splice(i,1);renderSetup();}

function renderSetup(){
  const list=document.getElementById('player-list');
  list.innerHTML='';
  players.forEach((p,i)=>{
    const row=document.createElement('div');
    row.className='player-row';
    row.innerHTML=`<input type="text" placeholder="Player ${i+1}" value="${p.name}" oninput="players[${i}].name=this.value"/>`
      +(players.length>2?`<button class="remove-btn" onclick="removePlayer(${i})">×</button>`:'');
    list.appendChild(row);
  });
}

function startGame(){
  const named=players.filter(p=>p.name.trim()!=='');
  if(named.length<2){alert('Add at least 2 players');return;}
  players=named.map(p=>({name:p.name.trim(),lives:3,eliminated:false}));
  initGame();
}

function initGame(){
  bar=60; currentIdx=0; dartScores=[]; multiplier=1;
  gameLog=players.map(()=>[]); eliminationOrder=[]; roundNumber=1;
  document.getElementById('setup').style.display='none';
  document.getElementById('end-screen').style.display='none';
  document.getElementById('game').style.display='block';
  renderGame();
}

function activePlayers(){return players.filter(p=>!p.eliminated);}

function renderGame(){
  document.getElementById('bar-val').textContent=bar;
  const grid=document.getElementById('players-grid');
  grid.innerHTML='';
  players.forEach((p,i)=>{
    const card=document.createElement('div');
    card.className='player-card'+(p.eliminated?' eliminated':'')+(i===currentIdx&&!p.eliminated?' active':'');
    const lives=Array.from({length:3},(_,j)=>`<div class="life-dot${j>=p.lives?' lost':''}"></div>`).join('');
    card.innerHTML=`<div class="player-name-col"><div class="pname">${p.name}</div>${i===currentIdx&&!p.eliminated?'<div class="active-tag">throwing</div>':''}</div><div class="lives-display">${lives}</div>`;
    grid.appendChild(card);
  });
  document.getElementById('scoring-header').textContent=`${players[currentIdx].name}'s throw`;
  setMultiplier(1);
  updateDartDisplay();
}

function setMultiplier(m){
  multiplier=m;
  document.getElementById('btn-x2').style.cssText=m===2?STYLE_X2:STYLE_OFF;
  document.getElementById('btn-x3').style.cssText=m===3?STYLE_X3:STYLE_OFF;
}

function toggleMultiplier(m){
  setMultiplier(multiplier===m?1:m);
  const inp=document.getElementById('dart-input');
  const raw=parseInt(inp.dataset.raw)||0;
  inp.value=raw===0?'':raw*multiplier;
}

function pad(v){
  const inp=document.getElementById('dart-input');
  let cur=inp.dataset.raw||'';
  if(v==='C'){cur='';setMultiplier(1);}
  else if(v==='back'){cur=cur.slice(0,-1);}
  else{cur=(cur===''&&v===0)?'':cur+v;}
  inp.dataset.raw=cur;
  const raw=parseInt(cur)||0;
  inp.value=cur===''?'':raw*multiplier;
  updateDartDisplay();
}

function getRaw(){
  const inp=document.getElementById('dart-input');
  const raw=parseInt(inp.dataset.raw||inp.value)||0;
  return{raw,final:raw*multiplier};
}

function updateDartDisplay(){
  const dartNum=dartScores.length;
  document.getElementById('dart-num-display').textContent=`${dartNum+1}/3`;
  for(let i=0;i<3;i++){
    const slot=document.getElementById('dart-'+i);
    if(dartScores[i]!==undefined){
      const d=dartScores[i];
      slot.className='dart-slot filled';
      slot.innerHTML=`<div class="dart-num">D${i+1}</div><div class="dart-val">${d.final}</div>${d.multiplier>1?`<div class="dart-multi">${d.raw}×${d.multiplier}</div>`:''}`;
    } else {
      slot.className='dart-slot'+(i===dartNum?' current':'');
      slot.innerHTML=`<div class="dart-num">D${i+1}</div><div class="dart-val">—</div>`;
    }
  }
  const total=dartScores.reduce((a,b)=>a+b.final,0);
  const rt=document.getElementById('rt-val');
  rt.textContent=total;
  rt.style.color=total<bar*0.6?'#3fc97a':total<bar?'#e8c84a':'#e24b4a';
  document.getElementById('undo-btn').disabled=dartScores.length===0;
}

function confirmDart(){
  const{raw,final}=getRaw();
  const inp=document.getElementById('dart-input');
  if(!inp.dataset.raw||inp.dataset.raw==='')return;
  const currentTotal=dartScores.reduce((a,b)=>a+b.final,0);
  if(currentTotal+final>bar){
    const lives=players[currentIdx].lives;
    document.getElementById('bust-sub-text').textContent=`${players[currentIdx].name} goes over ${bar}. ${lives>1?`${lives-1} life left`:'Eliminated!'} Bar resets to 60.`;
    document.getElementById('bust-modal').className='show';
    return;
  }
  dartScores.push({raw,multiplier,final});
  clearInput();
  if(dartScores.length===3){
    const total=dartScores.reduce((a,b)=>a+b.final,0);
    gameLog[currentIdx].push({round:roundNumber,bar,score:total,bust:false,eliminated:false});
    bar=total;
    advancePlayer();
  } else {
    updateDartDisplay();
  }
}

function confirmBust(){
  document.getElementById('bust-modal').className='';
  players[currentIdx].lives-=1;
  const isElim=players[currentIdx].lives<=0;
  if(isElim){players[currentIdx].eliminated=true;eliminationOrder.push(currentIdx);}
  gameLog[currentIdx].push({round:roundNumber,bar,score:null,bust:true,eliminated:isElim});
  bar=60; dartScores=[]; clearInput();
  const alive=activePlayers();
  if(alive.length===1){showEnd(alive[0]);return;}
  advancePlayer();
}

function cancelBust(){
  document.getElementById('bust-modal').className='';
  clearInput(); updateDartDisplay();
}

function clearInput(){
  const inp=document.getElementById('dart-input');
  inp.dataset.raw=''; inp.value='';
  setMultiplier(1);
}

function advancePlayer(){
  dartScores=[];
  let next=(currentIdx+1)%players.length, loops=0;
  while(players[next].eliminated&&loops<players.length){next=(next+1)%players.length;loops++;}
  if(next<=currentIdx)roundNumber++;
  currentIdx=next;
  renderGame();
}

function undoLast(){
  if(dartScores.length>0){dartScores.pop();clearInput();updateDartDisplay();}
}

function showEnd(winner){
  document.getElementById('game').style.display='none';
  document.getElementById('end-screen').style.display='block';
  document.getElementById('end-winner-name').textContent=winner.name;
  const winnerIdx=players.indexOf(winner);
  eliminationOrder.push(winnerIdx);
  const placeBadgeClass=p=>p===1?'place-1':p===2?'place-2':p===3?'place-3':'place-n';
  const placeLabel=p=>p===1?'1st':p===2?'2nd':p===3?'3rd':`${p}th`;
  const orderedIdxs=[winnerIdx,...[...eliminationOrder].reverse().filter(i=>i!==winnerIdx)];
  const container=document.getElementById('end-cards');
  container.innerHTML='';
  orderedIdxs.forEach((pi,rankIndex)=>{
    const p=players[pi], log=gameLog[pi], place=rankIndex+1;
    const busts=log.filter(r=>r.bust).length;
    const bestRounds=log.filter(r=>!r.bust&&r.score!==null);
    const best=bestRounds.length>0?Math.min(...bestRounds.map(r=>r.score)):null;
    const card=document.createElement('div');
    card.className='end-card'+(place===1?' winner-card':'');
    const roundsHtml=log.map(r=>{
      const scoreEl=r.bust
        ?`<span class="round-score" style="color:#e24b4a;font-family:'Bebas Neue',sans-serif;font-size:20px">—</span>`
        :`<span class="round-score" style="color:#3fc97a;font-family:'Bebas Neue',sans-serif;font-size:20px">${r.score}</span>`;
      const tag=r.eliminated?`<span class="elim-tag">Out</span>`:r.bust?`<span class="round-bust-tag">Bust</span>`:'';
      const lbl=!r.bust&&r.score!==null?`<span style="font-size:11px;color:#888">${r.score<r.bar?'set bar':r.score===r.bar?'matched':''}</span>`:'';
      return`<div class="end-round-row"><span class="round-num">R${r.round}</span><span class="round-bar-badge">bar ${r.bar}</span>${scoreEl}${tag}${lbl}</div>`;
    }).join('');
    card.innerHTML=`
      <div class="end-card-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="place-badge ${placeBadgeClass(place)}">${placeLabel(place)}</span>
          <span class="end-card-name">${p.name}</span>
        </div>
        <div class="end-card-stats">
          <div class="end-stat"><div class="end-stat-val" style="color:#e24b4a">${busts}</div><div class="end-stat-label">busts</div></div>
          ${best!==null?`<div class="end-stat"><div class="end-stat-val" style="color:#3fc97a">${best}</div><div class="end-stat-label">best</div></div>`:''}
        </div>
      </div>
      <div class="end-rounds">${roundsHtml||'<div style="font-size:12px;color:#888">No rounds played</div>'}</div>`;
    container.appendChild(card);
  });
}

function resetSamePlayers(){
  players=players.map(p=>({...p,lives:3,eliminated:false}));
  document.getElementById('end-screen').style.display='none';
  initGame();
}

function resetToSetup(){
  document.getElementById('game').style.display='none';
  document.getElementById('end-screen').style.display='none';
  document.getElementById('bust-modal').className='';
  document.getElementById('setup').style.display='block';
  players=[{name:'',lives:3,eliminated:false},{name:'',lives:3,eliminated:false}];
  bar=60; currentIdx=0; dartScores=[]; multiplier=1; gameLog=[]; eliminationOrder=[]; roundNumber=1;
  renderSetup();
}

players=[{name:'',lives:3,eliminated:false},{name:'',lives:3,eliminated:false}];
renderSetup();
</script>
